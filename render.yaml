# Render Blueprint: public, read-only demo of Know Your District.
# Live mode: data is read from Supabase (KYD_DATABASE_URL, the read-only kyd_app login) at start-up and
# the audit log is written there. The bundled SQLite database (kyd/data/kyd.sqlite) is the fallback.
# Frontend is the committed build (kyd/frontend/dist). Rollback: set KYD_DATA_MODE to sqlite.
# LLM tier: set KYD_LLM_PROVIDER=anthropic, KYD_LLM_MODEL and KYD_LLM_API_KEY in the Render dashboard;
# without them the agent answers with the rule-based tier (System 1) only.
services:
  - type: web
    name: know-your-district
    runtime: python
    plan: starter   # paid instance: stays awake. "free" sleeps after 15 idle minutes and takes about a minute to wake.
    region: oregon
    rootDir: kyd/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: KYD_DATA_MODE
        value: live
      - key: KYD_GRAPH_MODE
        value: auto
      # KYD_DATABASE_URL is set in the Render dashboard only. If the database cannot be reached
      # the app serves the bundled SQLite copy and /api/health says so.
      - key: KYD_DATABASE_URL
        sync: false
      # LLM tier (System 2): values are set in the Render dashboard, never in the repo.
      - key: KYD_LLM_PROVIDER
        sync: false
      - key: KYD_LLM_MODEL
        sync: false
      - key: KYD_LLM_API_KEY
        sync: false
      # Accounts (sign-in is required). Without KYD_AUTH_SECRET every redeploy signs everyone out; without
      # KYD_OWNER_EMAIL the first account registered becomes the owner. Set both in the dashboard.
      - key: KYD_AUTH_SECRET
        sync: false
      - key: KYD_OWNER_EMAIL
        sync: false
      # Optional: "Continue with Google" and forgot-password codes by email. Each is hidden until set.
      - key: KYD_GOOGLE_CLIENT_ID
        sync: false
      - key: KYD_SMTP_HOST
        sync: false
      - key: KYD_SMTP_PORT
        sync: false
      - key: KYD_SMTP_USER
        sync: false
      - key: KYD_SMTP_PASSWORD
        sync: false
      - key: KYD_SMTP_FROM
        sync: false
